# Command-line installer for the Agentville plugin, run with `uvx agentville install`.
#
# Publishing (maintainers):
#   1. On PyPI, add a trusted publisher for this project: owner `minhphamdonhat`,
#      repository `agentville`, workflow `publish.yml`, environment `pypi`.
#   2. Bump `__version__` in agentville/__init__.py, then push a tag
#      `agentville-cli--vX.Y.Z` that matches it; .github/workflows/publish.yml
#      tests, builds and publishes.
#   Manual fallback: `uv build`, then `uv publish` (trusted publishing or a token
#   set in the UV_PUBLISH_TOKEN environment variable).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentville"
dynamic = ["version"]
description = "Installs the Agentville plugin of skills and agents into Claude Code, and runs Townhall with `agentville townhall`."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
authors = [{ name = "Minh Pham Do Nhat" }]
keywords = ["claude-code", "plugin", "agents", "skills", "installer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
]
# Townhall's dependencies. The installer itself needs only the standard library and
# imports Townhall lazily, so `agentville install` never loads them.
dependencies = [
    "fastmcp>=4.1.3,<5",
    "markdown-it-py>=4.2.0,<5",
    "mdit-py-plugins>=0.6.1,<0.7",
    "pygments>=2.21.0,<3",
    "pyyaml>=6.0.3,<7",
    "rich>=15.0.0,<16",
    "temporalio>=1.34.0,<2",
    "textual>=8.2.8,<9",
    "typer>=0.27.3,<0.28",
]

[project.scripts]
agentville = "agentville.cli.app:main"

[project.urls]
Homepage = "https://github.com/minhphamdonhat/Agentville"
Repository = "https://github.com/minhphamdonhat/Agentville"
Issues = "https://github.com/minhphamdonhat/Agentville/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.hatch.version]
path = "agentville/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["agentville"]

[tool.hatch.build.targets.sdist]
only-include = ["agentville", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py315"
src = [".", "tests"]
include = ["agentville/**/*.py", "tests/**/*.py"]

[tool.uv]
required-version = ">=0.13.5"
