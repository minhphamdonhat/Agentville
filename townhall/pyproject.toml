[project]
name = "agentville"
version = "0.1.0"
description = "Umbrella CLI & MCP platform featuring the Townhall agent-orchestrated Kanban & documentation engine"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastmcp>=4.1.3,<5",
    "markdown-it-py>=4.2.0,<5",
    "mdit-py-plugins>=0.6.1,<0.7",
    "pygments>=2.21.0,<3",
    "pyyaml>=6.0.3,<7",
    "rich>=15.0.0,<16",
    "temporalio>=1.34.0,<2",
    "textual>=8.2.8,<9",
    "typer>=0.27.3,<0.28",
]

[project.scripts]
agentville = "agentville.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentville"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py315"
src = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.13.5"
